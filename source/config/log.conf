## ===========================================================================
## kellect easylogging++ config.
## Loaded from config\log.conf relative to the process working directory:
##   - service mode: CWD = %ProgramData%\Kellect (log\ is created by the MSI)
##   - GUI/standalone: CWD = install folder (create a log\ subfolder there to
##     receive files; easylogging++ does not create directories)
## All FILENAMEs are relative on purpose - no absolute paths like the upstream
## C:\logs / C:\logslog typos, and no path assigned to the FATAL ENABLED field.
## ===========================================================================

* GLOBAL:
    ENABLED                 =   true
    TO_FILE                 =   true
    TO_STANDARD_OUTPUT      =   false
    FORMAT                  =   "[%level | %datetime] | %msg"
    FILENAME                =   "log\log_%datetime{%Y%M%d}.log"
    MILLISECONDS_WIDTH      =   3
    PERFORMANCE_TRACKING    =   false
    MAX_LOG_FILE_SIZE       =   1048576
    LOG_FLUSH_THRESHOLD     =   0

* TRACE:
    FILENAME                =   "log\trace_log_%datetime{%Y%M%d}.log"

* DEBUG:
    FILENAME                =   "log\debug_log_%datetime{%Y%M%d}.log"

* FATAL:
    FILENAME                =   "log\fatal_log_%datetime{%Y%M%d}.log"

* ERROR:
    FILENAME                =   "log\error_log_%datetime{%Y%M%d}.log"

* WARNING:
    FILENAME                =   "log\warning_log_%datetime{%Y%M%d}.log"

* INFO:
    FILENAME                =   "log\info_log_%datetime{%Y%M%d}.log"

* VERBOSE:
    ENABLED                 =   false
