## ===========================================================================
## kellect easylogging++ config.
## Loaded from config\log.conf relative to the process working directory
## (the collector always runs with CWD = its own folder).
## All FILENAMEs are relative on purpose - no absolute paths like the upstream
## C:\logs / C:\logslog typos, and no path assigned to the FATAL ENABLED field.
##
## TO_FILE is OFF: MyLogger::writeLog is currently disabled (hot-path
## performance), so these files would all be empty - yet easylogging++ still
## creates 7 per-level files per day.
## When writeLog is restored, flip TO_FILE back to true - and clean up the
## hot call sites first (see source/tools/logger.cpp).
## ===========================================================================

* GLOBAL:
    ENABLED                 =   true
    TO_FILE                 =   false
    TO_STANDARD_OUTPUT      =   false
    FORMAT                  =   "[%level | %datetime] | %msg"
    ## FILENAME 全部注释:easylogging++ 在 configure 阶段就无条件创建每个
    ## FILENAME 的文件(连目录一起建,TO_FILE=false 也拦不住),而 writeLog
    ## 目前停用,这些文件全是空的——每级每天一个纯噪音。使用端唯一的采集
    ## 日志是服务模式的 stdout tee(%ProgramData%\Kellect\logs\
    ## kellect-stdout.log)。恢复 writeLog 时:取消注释 + TO_FILE=true。
    MILLISECONDS_WIDTH      =   3
    PERFORMANCE_TRACKING    =   false
    MAX_LOG_FILE_SIZE       =   1048576
    LOG_FLUSH_THRESHOLD     =   0

## * TRACE:
##     FILENAME                =   "log\trace_log_%datetime{%Y%M%d}.log"

## * DEBUG:
##     FILENAME                =   "log\debug_log_%datetime{%Y%M%d}.log"

## * FATAL:
##     FILENAME                =   "log\fatal_log_%datetime{%Y%M%d}.log"

## * ERROR:
##     FILENAME                =   "log\error_log_%datetime{%Y%M%d}.log"

## * WARNING:
##     FILENAME                =   "log\warning_log_%datetime{%Y%M%d}.log"

## * INFO:
##     FILENAME                =   "log\info_log_%datetime{%Y%M%d}.log"

* VERBOSE:
    ENABLED                 =   false
