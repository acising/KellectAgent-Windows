# config/secargus.ini - SecArgus MQTT output (protocol v1, design doc §9/§15)
# ---------------------------------------------------------------------------
# Enabled explicitly with `--mqtt` (CLI) or `[collector] mqtt=1` in agent.ini;
# when not enabled the collector behaves exactly as before.
#
# Currently supported by this build (lab/demo deployment):
#   * MQTT 3.1.1 over plain TCP (no TLS - not needed for the demo and it would
#     only add handshake/encryption overhead)
#   * QoS 1 event batches, business ACK on <prefix>/<id>/acks
#   * status (retained, LWT) + metrics, command/reply channel
#   * durable spool + resume on restart
# Not implemented: compression; TLS is intentionally out of scope.
# ---------------------------------------------------------------------------

[secargus]
enabled=1
endpoint_config=config\endpoint.json

[mqtt]
host=127.0.0.1
port=1883
username=
password=
keepalive_s=30
# empty => kellect-<endpoint_id>
client_id=
clean_start=1
qos=1

[topics]
prefix=secargus/v1/endpoints

[events]
max_batch_events=500
max_batch_bytes=1048576
flush_interval_ms=1000
max_queue_events=200000

[spool]
directory=spool
# 1 GiB; when full the agent stops accepting new batches and reports degraded
max_bytes=1073741824
ack_timeout_ms=30000
max_retries=5

[status]
interval_s=30

[metrics]
interval_s=60
