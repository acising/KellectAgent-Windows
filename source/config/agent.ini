# KellectService configuration (KellectAgent)
# ---------------------------------------------------------------------------
# The service reads this file from <install dir>\config\agent.ini at start.
# After editing:  net stop KellectAgent && net start KellectAgent
# (or: sc stop KellectAgent / sc start KellectAgent)
#
# The collector itself always runs with its working directory set to the
# install folder, so config\filter.txt, config\initImages.txt,
# config\eventStruct_*.xml and config\uuid are resolved there.
# ---------------------------------------------------------------------------

[service]
# SCM service name (used by sc/net). Changing it requires a reinstall.
name=KellectAgent
displayName=Kellect Agent
description=Kellect kernel event collector (ETW)
# auto | demand | disabled
startType=auto
# Supervisor mode: run kellect.exe as a supervised child instead of collecting
# in-process. Required for restart-to-apply-config and crash recovery without
# duplicate ETW sessions; 0 preserves the previous behaviour.
supervisor=0

[collector]
# -e: kernel event mask, hex, or "all"
#   0x01 Process   0x02 Thread   0x04 Image    0x08 File
#   0x10 Disk      0x20 Registry 0x40 CallStack 0x80 TcpIp
# A service should not enable 0x40 unless you need API-level stacks: callstacks
# add one extra event stream and a lot of CPU.
# behavior = process/thread/image/file/registry/TCP-IP + key stacks.
# diagnostic = adds DiskIO/CSwitch/memory/ALPC etc. (compatibility: events=all)
profile=behavior
#events=all
# Optional evidence profile. When set, it takes precedence over events.
#profile=provenance
#evidenceDirectory=%ProgramData%\Kellect\evidence
#kernelEtl=0

# output: file | probe | socket   (a service has no console)
#   probe -> WebSocket + MessagePack to the Kellect backend; credentials and
#            tuning live in config\probe.ini (recommended for this deployment).
output=file

# file output (used when output=file). %VAR% is expanded.
# The parent directory is created automatically.
file=%ProgramData%\Kellect\events\kellect-events.jsonl


# probe channel config path (used when output=probe)
probeConfig=config\probe.ini

# SecArgus MQTT: additive output, does not replace output=. Credentials and
# batching live in config\secargus.ini.
mqtt=0
mqttConfig=config\secargus.ini

# socket output (used when output=socket): ip:port
#socket=127.0.0.1:8888

# -u: optional user-mode provider (single choice)
#   0x01 Thread Pool | 0x02 DNS Client | 0x03 Print Service
userProvider=

# -x: comma separated event names dropped before parsing (noise control),
#     e.g. FileIODirNotify,FileIODirEnum
dropEvents=

# -wdm: convert events to the WDM (common data model) JSON shape
wdm=0

# --outputThreshold: events buffered before the writer is woken (0 = default)
outputThreshold=20

# --serialize-threads: JSON builder threads outside the ETW callback.
#   1 (default) keeps event order; 2-8 raise serialisation throughput but JSON
#   lines from different threads may interleave. Raise only if the stats line
#   shows output backpressure (output_waits > 0).
serializeThreads=1

# --max-file-mb: rotate the file= output every N MB (0 = never).
# A service runs for weeks; without rotation the event file grows unbounded.
maxFileMB=1024

# --append: append to an existing event file instead of truncating it.
# Keep this on for a service, otherwise every restart wipes collected data.
append=1

# --schema-probe: write a per-event frame-length report on stop.
# Use it once after installing on a new Windows build, then run
# tools/schema_lint.py against the report.
#schemaProbe=%ProgramData%\Kellect\log\schema-probe.json

# --schema-strict: drop events whose raw frame does not match the declared
# layout instead of emitting the best-effort prefix
schemaStrict=0
