# config/probe.ini - Kellect probe channel (WebSocket + MessagePack, protocol 1)
# ---------------------------------------------------------------------------
# Used by `kellect.exe --probe` (CLI) and by the service when agent.ini has
#     [collector]
#     output=probe
#
# Protocol reference: System/docs/probe-integration.md
# Register a probe first (admin UI http://localhost:5173/probes, or the
# POST /api/admin/probes API). The token is shown once and cannot be recovered;
# rotate it with POST /api/admin/probes/{probe_id}/token if lost.
#
# This file holds a credential: restrict it to the service account
# (e.g. icacls config\probe.ini /inheritance:r /grant:r SYSTEM:R).
#
# No TLS in protocol v1: ws:// only. Keep it on a trusted network or put a TLS
# proxy in front (the agent rejects wss:// with an explicit error).
# ---------------------------------------------------------------------------

# Backend WebSocket endpoint. Host:port defaults to :80 when omitted.
url=ws://127.0.0.1:8000/ws/probe

# Stable probe identity. Use the id returned by the registration API.
# Never run two collectors with the same probe_id: the backend replaces the old
# connection (error code "replaced").
probe_id=probe-000000000000

# One-time token from registration/rotation. Do not commit a real token.
token=replace-with-your-token

# Optional. Empty = auto-detect the machine name.
hostname=

# Shown in the admin UI, stored in the probe record.
platform=windows

# Local backlog (events) before the oldest are dropped. 20000 ~ a few minutes of
# full-rate kernel events; raise it if the backend is often unreachable.
queue=20000

# Events per batch (protocol hard limit 500; the server also caps it).
batch=200

# Bytes per batch (protocol hard limit 1048576; the server also caps it).
batch_bytes=524288

# Client-side event rate cap, events/second. 0 = unlimited.
rate=0

# Print channel errors to stderr (useful with --console).
verbose=0
