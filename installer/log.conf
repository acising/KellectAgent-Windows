## ===========================================================================
## kellect service-mode easylogging++ config (corrected).
## Installed to %ProgramData%\Kellect\log.conf by the MSI.
##
## The service launches kellect.exe with CWD = %ProgramData%\Kellect, so every
## FILENAME below (all-relative) resolves under %ProgramData%\Kellect\log\, which
## the MSI creates. This fixes the upstream config's broken absolute paths
## (C:\logs\ and the C:\logslog\ typo) and the FATAL entry that wrongly assigned
## a path to the ENABLED field.
## ===========================================================================

* GLOBAL:
    ENABLED                 =   true
    TO_FILE                 =   true
    TO_STANDARD_OUTPUT      =   false
    FORMAT                  =   "[%level | %datetime] | %msg"
    FILENAME                =   "log\log_%datetime{%Y%M%d}.log"
    MILLISECONDS_WIDTH      =   3
    PERFORMANCE_TRACKING    =   false
    MAX_LOG_FILE_SIZE       =   1048576
    LOG_FLUSH_THRESHOLD     =   0

* TRACE:
    FILENAME                =   "log\trace_log_%datetime{%Y%M%d}.log"

* DEBUG:
    FILENAME                =   "log\debug_log_%datetime{%Y%M%d}.log"

* FATAL:
    FILENAME                =   "log\fatal_log_%datetime{%Y%M%d}.log"

* ERROR:
    FILENAME                =   "log\error_log_%datetime{%Y%M%d}.log"

* WARNING:
    FILENAME                =   "log\warning_log_%datetime{%Y%M%d}.log"

* INFO:
    FILENAME                =   "log\info_log_%datetime{%Y%M%d}.log"

* VERBOSE:
    ENABLED                 =   false
